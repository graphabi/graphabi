name: Release dry run

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.12"
      - run: uv sync --locked --python 3.12
      - run: uv build
      - name: Install wheel into isolated environment
        run: |
          test_root="$(mktemp -d)"
          cd "$test_root"
          uv run --python 3.12 --isolated \
            --with "$GITHUB_WORKSPACE/dist/graphabi-0.1.0a1-py3-none-any.whl" \
            graphabi demo --allow-breaking
      - name: Install optional OpenAI Agents adapter extra
        run: |
          test_root="$(mktemp -d)"
          cd "$test_root"
          uv run --python 3.12 --isolated \
            --with "$GITHUB_WORKSPACE/dist/graphabi-0.1.0a1-py3-none-any.whl[openai-agents]" \
            python -m examples.openai_agents_adapter.example
      - name: Inspect distributions
        run: uv run python -m zipfile -l dist/graphabi-0.1.0a1-py3-none-any.whl

      # Publishing is intentionally absent. A maintainer must review artifacts and add an
      # environment-protected publish job in a future release process.
