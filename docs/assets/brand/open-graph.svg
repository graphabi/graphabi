<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GraphABI Semantic Compatibility Infrastructure</title>
  <desc id="desc">The schema passes, meaning breaks at researcher to verifier, and GraphABI traces the affected path.</desc>
