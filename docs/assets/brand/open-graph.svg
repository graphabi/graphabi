  </g>
  <text x="58" y="183" fill="#F8FAFC" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="650" letter-spacing="-2">Your schema passed.</text>
  <text x="58" y="249" fill="#F8FAFC" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="650" letter-spacing="-2">Your agent still <tspan fill="#EF4444">broke.</tspan></text>
  <text x="58" y="297" fill="#94A3B8" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">Semantic Compatibility Infrastructure for agent graphs.</text>
  <g transform="translate(58 376)" font-family="SFMono-Regular,Consolas,monospace">
