<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">GraphABI — semantic compatibility testing for AI-agent graphs</title>
  <desc id="desc">A structural schema check passes while GraphABI detects a semantic failure between researcher and verifier and traces its downstream impact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08101e"/>
      <stop offset="0.55" stop-color="#111f38"/>
      <stop offset="1" stop-color="#17243e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.66">
      <stop stop-color="#5e7cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5e7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#02050a" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-red" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0L11 4.5L0 9Z" fill="#ff6b75"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0L11 4.5L0 9Z" fill="#7e91b3"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 532C201 477 329 592 558 539C774 489 945 394 1280 470V640H0Z" fill="#09111f" opacity="0.58"/>

  <g transform="translate(72 62)">
    <rect width="58" height="58" rx="14" fill="#647dff"/>
    <path d="M16 18H42M16 29H34M16 40H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="41" cy="29" r="5" fill="#ff7b84"/>
    <text x="78" y="43" fill="#f8faff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="39" font-weight="800" letter-spacing="-1">GraphABI</text>
    <rect x="278" y="12" width="78" height="32" rx="16" fill="#223252" stroke="#496185"/>
    <text x="317" y="34" text-anchor="middle" fill="#b9c7de" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">ALPHA</text>
  </g>

  <text x="72" y="180" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="43" font-weight="760" letter-spacing="-1.2">Semantic compatibility testing</text>
  <text x="72" y="229" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="43" font-weight="760" letter-spacing="-1.2">for AI-agent graphs.</text>
  <text x="74" y="280" fill="#aebdd5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21">Schemas can pass while meaning silently breaks.</text>

  <g transform="translate(72 324)" filter="url(#shadow)">
    <rect width="1136" height="240" rx="20" fill="#111d31" stroke="#344766"/>

    <g transform="translate(28 24)">
      <rect width="226" height="66" rx="12" fill="#172840" stroke="#3d5779"/>
      <text x="18" y="25" fill="#9fb0ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SCHEMA</text>
      <text x="18" y="52" fill="#55d5a3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="800">PASS</text>
      <text x="96" y="50" fill="#9fb0ca" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">same model</text>
    </g>
    <g transform="translate(274 24)">
      <rect width="250" height="66" rx="12" fill="#2a202e" stroke="#784554"/>
      <text x="18" y="25" fill="#b8a7b3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SEMANTICS</text>
      <text x="18" y="52" fill="#ff737d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="800">FAIL</text>
      <text x="96" y="50" fill="#c0adb6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">trace-backed</text>
    </g>
    <text x="552" y="52" fill="#9fb0ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">FIRST BROKEN EDGE</text>
    <text x="552" y="80" fill="#ff7b84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">researcher → verifier</text>

    <g transform="translate(28 132)">
      <rect width="202" height="64" rx="12" fill="#1a2a42" stroke="#536c91" stroke-width="2"/>
      <text x="101" y="30" text-anchor="middle" fill="#f4f7fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">researcher</text>
      <text x="101" y="49" text-anchor="middle" fill="#91a4c1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">producer</text>
      <line x1="202" y1="32" x2="281" y2="32" stroke="#ff6b75" stroke-width="5" marker-end="url(#arrow-red)"/>
      <text x="243" y="17" text-anchor="middle" fill="#ff7b84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="800">BREAK</text>
      <rect x="290" width="202" height="64" rx="12" fill="#2a202e" stroke="#b15365" stroke-width="2"/>
      <text x="391" y="30" text-anchor="middle" fill="#f4f7fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">verifier</text>
      <text x="391" y="49" text-anchor="middle" fill="#ff9ca4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">directly affected</text>
      <line x1="492" y1="32" x2="571" y2="32" stroke="#7e91b3" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <rect x="580" width="224" height="64" rx="12" fill="#1a2a42" stroke="#536c91" stroke-width="2"/>
      <text x="692" y="30" text-anchor="middle" fill="#f4f7fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">decision_maker</text>
      <text x="692" y="49" text-anchor="middle" fill="#91a4c1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">transitively affected</text>
      <line x1="804" y1="32" x2="883" y2="32" stroke="#7e91b3" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <rect x="892" width="188" height="64" rx="12" fill="#1a2a42" stroke="#536c91" stroke-width="2"/>
      <text x="986" y="30" text-anchor="middle" fill="#f4f7fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">publisher</text>
      <text x="986" y="49" text-anchor="middle" fill="#91a4c1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">terminal</text>
    </g>
  </g>

  <text x="1208" y="608" text-anchor="end" fill="#8295b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">github.com/graphabi/graphabi</text>
</svg>
