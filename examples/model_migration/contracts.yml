version: "0.2"
graph: model_migration
nodes:
  - id: model_producer
  - id: policy_gate
    terminal: true
graph_edges:
  - id: model_producer_to_policy_gate
    producer: model_producer
    consumer: policy_gate
edges:
  - id: model_producer_to_policy_gate
    producer: model_producer
    consumer: policy_gate
    schema:
      model: ModelPacket
    invariants:
      - id: verified_requires_opened_supporting_source
        evaluator: provenance
        description: >
          When verified is true, the producer must record a successfully opened source that
          supports the numeric claim.
        failure_message: >
          The model returned verified=true without recorded access to supporting evidence.
        severity: breaking
        rule: opened_supporting_source
