[build-system]
requires = ["hatchling>=1.31.0", "hatch-fancy-pypi-readme>=24.1,<25"]
build-backend = "hatchling.build"

[project]
name = "graphabi"
version = "0.1.0a3"
description = "Semantic Compatibility Infrastructure for agent graphs"
dynamic = ["readme"]
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GraphABI contributors" }]
keywords = ["agents", "contracts", "graph-infrastructure", "langgraph", "semantic-compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.25,<5",
  "langgraph>=1.0,<1.3",
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=15.0.0,<16",
  "typer>=0.27.1,<1",
  "uvicorn>=0.52.1,<1",
]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.20,<0.21"]

[project.urls]
Homepage = "https://graphabi.github.io"
Repository = "https://github.com/graphabi/graphabi"
Documentation = "https://github.com/graphabi/graphabi/tree/main/docs"
Issues = "https://github.com/graphabi/graphabi/issues"
Changelog = "https://github.com/graphabi/graphabi/blob/main/CHANGELOG.md"

[project.scripts]
graphabi = "graphabi.cli.app:app"
graphabi-github-summary = "graphabi.ci.github:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatch-fancy-pypi-readme>=24.1,<25",
  "hypothesis>=6.165.2,<7",
  "openai-agents>=0.20,<0.21",
  "pyright>=1.1.403,<2",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphabi", "examples"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/examples",
  "/regression_corpus",
  "/scripts",
  "/docs",
  "/tests",
  "/README.md",
  "/AUDIT.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/Makefile",
  "/action.yml",
  "/pyproject.toml",
]

# Renders the PyPI long description from README.md at build time, rewriting only
# repository-relative links and images to absolute GitHub URLs pinned to this
# release's tag. README.md itself is left untouched and keeps rendering correctly
# on GitHub, where relative links resolve against the current branch. The pinned
# ref below must be updated together with [project].version; see
# tests/unit/test_pypi_readme.py for the regression test that enforces this.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Image embeds under docs/assets/ need raw file bytes, not a GitHub blob HTML page.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((docs/assets/[\w./-]+)\)'
replacement = '\1(https://raw.githubusercontent.com/graphabi/graphabi/v0.1.0-alpha.3/\2)'

# Directory links resolve as a GitHub tree listing, not a single blob.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((examples/[\w./-]+|regression_corpus)\)'
replacement = '](https://github.com/graphabi/graphabi/tree/v0.1.0-alpha.3/\1)'

# Every remaining relative link is a single file, viewed as a GitHub blob page.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[\w./-]+\.md|docs/assets/[\w./-]+|CONTRIBUTING\.md|SECURITY\.md|CHANGELOG\.md|LICENSE)\)'
replacement = '](https://github.com/graphabi/graphabi/blob/v0.1.0-alpha.3/\1)'

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["src/graphabi/reporting/templates"]
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
  "integration: exercises multiple package layers",
  "e2e: executes the public command-line workflow",
]

[tool.coverage.run]
branch = true
source = ["graphabi"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
