version: '0.2'
graph: corpus_freshness
nodes:
- id: retriever
- id: ranker
  terminal: true
graph_edges:
- id: retriever_to_ranker
  producer: retriever
  consumer: ranker
edges:
- id: retriever_to_ranker
  producer: retriever
  consumer: ranker
  invariants:
